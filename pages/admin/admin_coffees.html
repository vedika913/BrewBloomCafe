<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

{% include "header.html" %}

<div class="admin-container">

    <h1>☕ Coffee Management</h1>

    <a href="/addcoffee">
        <button class="add-btn">+ Add Coffee</button>
    </a>

    <table>

        <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Action</th>
        </tr>

        {% for coffee in coffees %}

        <tr>

            <!-- Image -->
            <td>
                {% if coffee.image %}
                    <img src="{{ url_for('static', filename='images/' + coffee.image) }}"
                         alt="{{ coffee.name }}"
                         width="80"
                         height="80"
                         style="object-fit: cover; border-radius: 8px;">
                {% else %}
                    No Image
                {% endif %}
            </td>

            <!-- Name -->
            <td>
                {{ coffee.name }}
            </td>

            <!-- Category -->
            <td>
                {{ coffee.category }}
            </td>

            <!-- Price -->
            <td>
                ₹{{ coffee.price }}
            </td>

            <!-- Actions -->
        <td class="coffee-actions">
    <a href="/editcoffee/{{ coffee._id }}" class="edit-btn">
        ✏️ Edit
    </a>

    <a href="/deletecoffee/{{ coffee._id }}"
       class="delete-btn"
       onclick="return confirm('Are you sure you want to delete this coffee?');">
        🗑️ Delete
    </a>
</td>

        </tr>

        {% endfor %}

    </table>

</div>

{% include "footer.html" %}

</body>

</html>
