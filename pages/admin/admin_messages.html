<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Messages</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

{% include "header.html" %}


<section class="admin-messages">

    <h1>☕ Customer Messages</h1>

    <table class="message-table">

        <thead>

            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Message</th>
            </tr>

        </thead>

        <tbody>

            {% for message in messages %}

            <tr>

                <td>
                    {{ message.name }}
                </td>

                <td>
                    {{ message.email }}
                </td>

                <td>
                    {{ message.phone }}
                </td>

                <td>
                    {{ message.message }}
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</section>


{% include "footer.html" %}

</body>

</html>
