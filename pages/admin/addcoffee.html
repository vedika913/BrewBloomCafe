<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Coffee</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

{% include "header.html" %}

<div class="admin-container">

    <h1>☕ Add New Coffee</h1>

    <form method="POST"
          action="/addcoffee"
          enctype="multipart/form-data"
          class="coffee-form">

        <!-- Coffee Name -->
        <label for="name">Coffee Name</label>

        <input type="text"
               id="name"
               name="name"
               placeholder="Enter coffee name"
               required>


        <!-- Category -->
        <label for="category">Category</label>

        <input type="text"
               id="category"
               name="category"
               placeholder="Example: Hot Coffee"
               required>


        <!-- Price -->
        <label for="price">Price</label>

        <input type="number"
               id="price"
               name="price"
               placeholder="Enter price"
               min="1"
               required>


        <!-- Coffee Image -->
        <label for="image">Coffee Photo</label>

        <input type="file"
               id="image"
               name="image"
               accept="image/*"
               required>


        <!-- Add Button -->
        <button type="submit" class="add-btn">
            ☕ Add Coffee
        </button>


        <!-- Cancel -->
        <a href="/admin/coffees" class="cancel-btn">
            Cancel
        </a>

    </form>

</div>

{% include "footer.html" %}

</body>

</html>
